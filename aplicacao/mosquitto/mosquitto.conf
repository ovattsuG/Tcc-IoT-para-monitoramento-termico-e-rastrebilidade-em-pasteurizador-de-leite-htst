# Mosquitto do computador da aplicação (SW-01, decisões 7 e 9 do plano).
# Instalar: copiar para C:\Program Files\mosquitto\mosquitto.conf e reiniciar o serviço "mosquitto".

# Escuta em todas as placas de rede (o ESP chega pelo Wi-Fi). Quem limita à rede local é o firewall do Windows,
# com a regra só no perfil "Privado" (ver docs/instalacao-aplicacao.md).
listener 1883 0.0.0.0
# Sem usuário/senha: a SRS aceita sem TLS e sem autenticação, com a rede local restrita (seção 6).
allow_anonymous true

# Guarda em disco as sessões persistentes (Node-RED) e as mensagens QoS 1 ainda não entregues.
# Grava ao parar o serviço (desligar o PC normalmente) e a cada autosave_interval segundos.
persistence true
persistence_location C:\mqtt\

log_dest file C:\mqtt\mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
