[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5
; Mostra o que se digita no monitor e manda só LF no Enter (comandos get/set).
monitor_echo = yes
monitor_eol = LF
lib_deps =
    adafruit/Adafruit MAX31865 library@^1.6.2
    SPI
    Wire


[env:native]
platform = native

